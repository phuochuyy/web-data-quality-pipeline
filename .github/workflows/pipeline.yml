name: pipeline

on:
  schedule:
    - cron: "0 1 * * *"   # daily 01:00 UTC
  workflow_dispatch:
    inputs:
      freshness_sla_hours:
        description: "Freshness SLA in hours (0 forces a FAIL, to test alerting)"
        default: "26"
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - run: pytest -q

  run:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write          # open/close the data-quality issue
    outputs:
      report: ${{ steps.site.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m playwright install --with-deps chromium

      # keep the DuckDB file between runs so volume anomalies can be detected
      - uses: actions/cache/restore@v6
        with:
          path: data/warehouse.duckdb
          key: warehouse-${{ github.run_id }}
          restore-keys: warehouse-

      - name: Scrape, load, check, report
        id: pipeline
        run: wdq run
        continue-on-error: true
        env:
          WDQ_MAX_AGE_HOURS: ${{ inputs.freshness_sla_hours || '26' }}

      - uses: actions/cache/save@v6
        if: always()
        with:
          path: data/warehouse.duckdb
          key: warehouse-${{ github.run_id }}

      - name: Publish report to the job summary
        if: always()
        run: |
          if [ -f reports/report.md ]; then cat reports/report.md >> "$GITHUB_STEP_SUMMARY";
          else echo "No report was produced - see the pipeline step log." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Open, update or close the data-quality issue
        if: always() && github.ref == 'refs/heads/main'
        run: bash .github/scripts/quality_issue.sh "${{ steps.pipeline.outcome }}" reports/report.md
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: data-quality-report
          path: |
            reports/
            data/raw/
          retention-days: 14

      - name: Build the Pages site from the latest report
        id: site
        if: always() && hashFiles('reports/report.html') != ''
        run: |
          mkdir -p _site
          cp reports/report.html _site/index.html
          cp reports/report.md _site/report.md
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v5
        if: always() && steps.site.outputs.ready == 'true'
        with:
          path: _site

      - name: Fail the job if a quality check failed
        if: steps.pipeline.outcome == 'failure'
        run: exit 1

  # publish the latest report, also when checks failed (the page then shows the failure)
  deploy:
    needs: run
    if: always() && needs.run.outputs.report == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      deployments: write     # delete old deployment records
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # every run creates a deployment record; keep only the newest one
      - name: Delete older Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=100" --jq '.[1:][].id' |
          while read -r id; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=inactive >/dev/null
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/deployments/$id" >/dev/null
          done
